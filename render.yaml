services:
  - type: web
    name: bclearns
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: contact.bclearns@gmail.com
      - key: CLOUDINARY_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false

  - type: cron
    name: bclearns-reminders
    runtime: node
    schedule: "0 * * * *"
    buildCommand: echo skip
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
    envVars:
      - key: APP_URL
        fromService:
          name: bclearns
          type: web
          envVarKey: APP_URL
      - key: CRON_SECRET
        fromService:
          name: bclearns
          type: web
          envVarKey: CRON_SECRET

  - type: cron
    name: bclearns-digest
    runtime: node
    schedule: "0 13 * * 1"
    buildCommand: echo skip
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/digest"
    envVars:
      - key: APP_URL
        fromService:
          name: bclearns
          type: web
          envVarKey: APP_URL
      - key: CRON_SECRET
        fromService:
          name: bclearns
          type: web
          envVarKey: CRON_SECRET
